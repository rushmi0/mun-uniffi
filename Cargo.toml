[package]
name = "mun"
version = "0.1.0"
edition = "2024"

[lib]
name = "mun"
crate-type = ["cdylib", "staticlib", "rlib"]

# This crate lives inside the Mun checkout but is not part of its workspace.
[workspace]

[dependencies]
uniffi = { version = "=0.29.4", features = ["tokio", "cli"] }
mun_compiler = { path = "../crates/mun_compiler" }
mun_runtime = { path = "../crates/mun_runtime" }
tempfile = "3.27.0"
thiserror = "2.0.20"
